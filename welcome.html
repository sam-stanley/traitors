<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
</head>
<body>
  <h1 id="welcomeText">Welcome</h1>

  <script>
    const params = new URLSearchParams(window.location.search);
    const usernameFromUrl = params.get("u");
    const usernameFromStorage = localStorage.getItem("loggedInUsername");

    const username = usernameFromUrl || usernameFromStorage;

    if (username) {
      document.getElementById("welcomeText").textContent = `Welcome ${username}`;
    } else {
      document.getElementById("welcomeText").textContent = "Welcome";
    }
  </script>
</body>
</html>
