<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Room</title>

<style>
  /* ---------- Base / reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { width: 100%; max-width: 100%; margin: 0; overflow-x: hidden; }
  :root { height: 100%; }

  body{
    min-height: 100vh;
    min-height: 100dvh;
    font-family: Arial, sans-serif;
    color: #fff;
    display: grid;
    grid-template-columns: minmax(0, 260px) minmax(0, 1fr);
  }

  body::before{
    content:"";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
      var(--bg-url);
    background-size: cover;
    background-position: center;
    z-index: -1;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background: rgba(0,0,0,.55);
    border-right: 1px solid rgba(255,255,255,.12);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }

  .sidebar h2{ margin: 0; font-size: 20px; }
  .small{ opacity: .9; font-size: 13px; }

  .room-list{ display: grid; gap: 8px; }
  .room-btn, .logout-btn{
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.08);
    color: #fff;
    cursor: pointer;
    font-size: 12px;
    text-align: center;
  }
  .room-btn:hover, .logout-btn:hover{ background: rgba(255,255,255,.14); }
  .room-btn.active{ background: rgba(255,255,255,.20); }

  .players{
    margin-top: 6px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.12);
  }
  .players ul{ margin: 8px 0 0; padding-left: 18px; }

  /* ---------- Main layout ---------- */
  .main{
    padding: 16px;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 12px;
    height: 100vh;
    height: 100dvh;
    min-width: 0;
  }

  .header{
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    padding: 12px 14px;
  }

  .notice{
    margin: 0;
    font-size: 13px;
    line-height: 1.2;
    opacity: .95;
    padding: 0;
  }

  .chat{
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    padding: 12px;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
    min-width: 0;
  }

  .msg{
    padding: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06);
    margin-bottom: 10px;
  }

  .meta{
    font-size: 12px;
    opacity: .9;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .text{
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .composer{
    position: sticky;
    bottom: 12px;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    backdrop-filter: blur(6px);
    z-index: 1;
  }

  input{
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.35);
    color: #fff;
    outline: none;
    font-size: 16px; /* prevents mobile zoom */
    min-width: 0;
  }

  button.send{
    padding: 12px 14px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    background: #4f46e5;
    color: #fff;
    min-width: 0;
  }
  button.send:hover{ background: #4338ca; }

  /* Mobile players panel hidden on desktop */
  .playersPanel{ display: none !important; }

  /* ---------- Mobile ( less than or equal to 820px) ---------- */
  @media (max-width: 820px){
    body{
      grid-template-columns: 1fr !important;
      grid-template-rows: auto 1fr !important;
    }

    .sidebar{
      padding: 10px;
      border-right: none !important;
      border-bottom: 1px solid rgba(255,255,255,.12) !important;
      gap: 10px;
    }

    .room-list{
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }
    .room-btn{ flex: 0 0 auto; white-space: nowrap; }

    .main{
      padding: 8px;
      gap: 6px;
      grid-template-rows: auto auto auto auto; /* header, chat, composer, players */
      align-content: start; /* stop grid stretching */
      height: 100vh;
      height: 100dvh;
    }

    .header{
      padding: 4px 8px !important;
      align-items: flex-start;
    }
    .notice{ font-size: 11px; }

    .chat{
      height: 40dvh;
      padding: 10px;
    }

    .composer{
      position: static;
      bottom: auto;
      padding: 0 6px;
      gap: 6px;
      border-radius: 10px;
      background: rgba(0,0,0,.45);
    }
    .composer input{ height: 38px; padding: 6px 8px; line-height: 1.2; }
    .composer button.send{ height: 38px; padding: 6px 10px; font-size: 14px; line-height: 1.2; }

    /* Mobile: show bottom players panel, hide sidebar players */
    .players{ display: none !important; }
    .playersPanel{ display: block !important; }
    .playersPanel ul{ margin: 0; padding-left: 18px; }
    .playersTitle{ font-size: 13px; font-weight: 400; margin-bottom: 8px; opacity: .95; }
  }
</style>


</head>

<body>
	<aside class="sidebar">

		<div>
			<h2 id="roomTitle">Room</h2>
			<div class="small" id="userMeta"></div>
		</div>

		<button class="logout-btn" id="logoutBtn" style="padding: 8px 10px;">Log out</button>

		<div>
			<div class="small" style="margin-bottom:8px;">Move rooms:</div>
			<div class="room-list" id="roomList"></div>
		</div>


		<div class="players" id="playersBox" style="display:none;">
			<div class="small">Players here now:</div>
			<ul id="playersListDesktop"></ul>
		</div>

	</aside>

	<main class="main">

		<div class="header">
			<div>
				<div class="notice" id="ruleLine"></div>
			</div>
		</div>

		<div class="chat" id="chat"></div>

		<div class="composer" id="composer" style="display:none;">
			<input id="msgInput" maxlength="500" placeholder="Type a message..." />
			<button class="send" id="sendBtn">Send</button>
		</div>

		<div class="playersPanel" id="playersPanel" style="display:none;">
			<div class="playersTitle">Players here now</div>
			<ul id="playersListMobile"></ul>
		</div>

		<p id="error" class="notice" style="color:#ffb4b4;"></p>

	</main>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  // Use your existing project values (copied from your index.html)
  const SUPABASE_URL = "https://grjrvxafmemeohmvllik.supabase.co";
  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyanJ2eGFmbWVtZW9obXZsbGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2Njc0OTcsImV4cCI6MjA4NTI0MzQ5N30.FlOqi4pTMOoAxMrNiIwF8fq4cQGc6k6886UnIbuVs2Y";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Require a valid Supabase Auth session (RLS depends on this)
  const {
    data: { session },
  } = await supabase.auth.getSession();
  console.log("session user id:", session?.user?.id);

  if (!session) {
    window.location.href = "index.html";
  }

  const ROOM_BACKGROUNDS = {
    Library: "url('library.jpg')",
    Bar: "url('bar.jpg')",
    "Billiard Room": "url('billiardroom.jpg')",
    Kitchen: "url('kitchen.jpg')",
    Reception: "url('reception.jpg')",
  };

  const roomNames = Object.keys(ROOM_BACKGROUNDS);

  const username = localStorage.getItem("loggedInUsername");
  const accountType = localStorage.getItem("accountType");
  const currentRoomStored = localStorage.getItem("currentRoom");

  const params = new URLSearchParams(window.location.search);
  const room = params.get("room");

  const errorEl = document.getElementById("error");

  if (!username || !accountType) {
    window.location.href = "index.html";
  }

  // Must have a room, and Hallway can't be re-entered
  if (!room || !roomNames.includes(room)) {
    // If they have a stored room, go there; otherwise back to hallway
    if (currentRoomStored) {
      window.location.href = `room.html?room=${encodeURIComponent(currentRoomStored)}`;
    } else {
      window.location.href = "hallway.html";
    }
  }

  // Lock hallway return: once in a room, stay in rooms
  localStorage.setItem("currentRoom", room);

  // Apply background
  document.documentElement.style.setProperty("--bg-url", ROOM_BACKGROUNDS[room]);

  // UI header
  document.getElementById("roomTitle").textContent = room;
  document.getElementById("userMeta").textContent = `${username} (${accountType})`;

  // Sidebar room list
  const list = document.getElementById("roomList");
  roomNames.forEach((r) => {
    const btn = document.createElement("button");
    btn.className = "room-btn" + (r === room ? " active" : "");
    btn.textContent = r;
    btn.onclick = () => (window.location.href = `room.html?room=${encodeURIComponent(r)}`);
    list.appendChild(btn);
  });

  // Logout (must sign out of Supabase Auth)
  document.getElementById("logoutBtn").onclick = async () => {
    await supabase.auth.signOut();
    localStorage.clear();
    window.location.href = "index.html";
  };

  // Rules line + composer visibility
  const composer = document.getElementById("composer");
  const ruleLine = document.getElementById("ruleLine");
  const playersPanel = document.getElementById("playersPanel");

  if (accountType === "player") {
    composer.style.display = "grid";
    ruleLine.textContent =
      "Players: messages are visible to players for 3 minutes; guests can see them forever.";
    document.getElementById("playersBox").style.display = "block";
    if (playersPanel) playersPanel.style.display = "block";
  } else {
    ruleLine.textContent = "Guests: you can view messages, but cannot post.";
    if (playersPanel) playersPanel.style.display = "none";
  }

  // Helpers
  const chatEl = document.getElementById("chat");

  function minutesRemaining(createdAtIso) {
    const created = new Date(createdAtIso).getTime();
    const expires = created + 3 * 60 * 1000;
    const now = Date.now();
    const msLeft = expires - now;
    return Math.max(0, Math.ceil(msLeft / 60000));
  }

  function formatTime(createdAtIso) {
    const d = new Date(createdAtIso);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function renderMessages(messages) {
    chatEl.innerHTML = "";
    for (const m of messages) {
      const wrap = document.createElement("div");
      wrap.className = "msg";

      const meta = document.createElement("div");
      meta.className = "meta";

      const left = document.createElement("div");
      left.textContent = `${m.username} • ${formatTime(m.created_at)}`;

      const right = document.createElement("div");
      if (accountType === "player") {
        right.textContent = `disappears in ~${minutesRemaining(m.created_at)} min`;
      } else {
        right.textContent = "";
      }

      meta.appendChild(left);
      meta.appendChild(right);

      const text = document.createElement("div");
      text.className = "text";
      text.textContent = m.message;

      wrap.appendChild(meta);
      wrap.appendChild(text);

      chatEl.appendChild(wrap);
    }

    // Keep scrolled to bottom
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  async function loadMessages() {
    errorEl.textContent = "";

    // RLS handles player/guest visibility rules now (do NOT filter by created_at here)
    const { data, error } = await supabase
      .from("messages")
      .select("id, created_at, message, username, room")
      .eq("room", room)
      .order("id", { ascending: true });

    if (error) {
      errorEl.textContent = "Error loading messages: " + error.message;
      return;
    }
    renderMessages(data || []);
  }

  // Posting (players only)
  async function sendMessage() {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    errorEl.textContent = "";

    // Do NOT send username; DB trigger sets it from auth.uid() -> users table
    const { error } = await supabase.from("messages").insert([
      {
        room,
        message: text,
      },
    ]);

    if (error) {
      errorEl.textContent = "Error sending message: " + error.message;
    } else {
      await loadMessages();
    }
  }

  if (accountType === "player") {
    document.getElementById("sendBtn").onclick = sendMessage;
    document.getElementById("msgInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  }

  // Presence (players only): heartbeat + list others in same room
  async function upsertPresence() {
    if (accountType !== "player") return;

    // Keep PK = username. Trigger/policy enforces this matches auth user,
    // and sets account_type + last_seen server-side.
	await supabase.from("presence").upsert([{
	  username,
	  room
	}], { onConflict: "username" });

  }

  async function loadPresence() {
    if (accountType !== "player") return;

    // Consider "present" if seen in last 20 seconds
    const cutoff = new Date(Date.now() - 20 * 1000).toISOString();

    const { data, error } = await supabase
      .from("presence")
      .select("username")
      .eq("room", room)
      .eq("account_type", "player")
      .gte("last_seen", cutoff)
      .order("username", { ascending: true });

    if (error) return;

    const listDesktop = document.getElementById("playersListDesktop");
    const listMobile = document.getElementById("playersListMobile");

    if (listDesktop) listDesktop.innerHTML = "";
    if (listMobile) listMobile.innerHTML = "";

    (data || [])
      .filter((p) => p.username !== username)
      .forEach((p) => {
        if (listDesktop) {
          const li = document.createElement("li");
          li.textContent = p.username;
          listDesktop.appendChild(li);
        }
        if (listMobile) {
          const li = document.createElement("li");
          li.textContent = p.username;
          listMobile.appendChild(li);
        }
      });
  }

  // Initial load
  await loadMessages();
  await upsertPresence();
  await loadPresence();

  // Polling loop:
  setInterval(loadMessages, 5000);
  setInterval(async () => {
    await upsertPresence();
    await loadPresence();
  }, 10000);
</script>

</body>
</html>
