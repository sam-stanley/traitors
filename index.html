<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <style>
    /* Page background */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

body::before {
  content: "";
  position: fixed;
  inset: 0;

  background:
    linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
    url("main.jpg");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  z-index: -1;
}


    /* Login card */
    .login-box {
      width: 100%;
      max-width: 380px;
      padding: 30px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .login-box h2 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 28px;
    }

    /* Form layout */
    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    /* Button */
    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #4f46e5;
      color: white;
      transition: 0.2s ease;
    }

    button:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }

    /* Error message */
    #message {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: #b91c1c;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h2>Login</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>

      <button type="submit">Login</button>
    </form>

  <p id="message" style="color: red;"></p>
  </div>


 <script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const SUPABASE_URL = "https://grjrvxafmemeohmvllik.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyanJ2eGFmbWVtZW9obXZsbGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2Njc0OTcsImV4cCI6MjA4NTI0MzQ5N30.FlOqi4pTMOoAxMrNiIwF8fq4cQGc6k6886UnIbuVs2Y";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("loginForm");
  const messageEl = document.getElementById("message"); // make sure you have <p id="message"></p> or similar

  // If already logged in, skip login page
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    window.location.href = "hallway.html";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (messageEl) messageEl.textContent = "";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
      if (messageEl) messageEl.textContent = "Please enter a username and password.";
      return;
    }

    // Lookup email/account_type/auth_id for username (RPC so we don't expose users table)
    const { data, error: lookupError } = await supabase.rpc("login_lookup", { uname: username });
    const userRow = data?.[0];

    if (lookupError || !userRow?.email) {
      if (messageEl) messageEl.textContent = "Invalid username or password.";
      return;
    }

    // Auth sign-in (no self-registration; admin created these users)
    const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
      email: userRow.email,
      password
    });

    if (authError || !authData?.user) {
      if (messageEl) messageEl.textContent = "Invalid username or password.";
      return;
    }

    // Safety: verify auth user matches your mapping
    if (userRow.auth_id && authData.user.id !== userRow.auth_id) {
      await supabase.auth.signOut();
      if (messageEl) messageEl.textContent = "Account mapping error. Contact admin.";
      return;
    }

    // Store for UI convenience (RLS uses the auth session)
    localStorage.setItem("loggedInUsername", userRow.username);
    localStorage.setItem("accountType", (userRow.account_type || "").toLowerCase());

    localStorage.removeItem("currentRoom");
    window.location.href = "hallway.html";
  });
