<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
</head>
<body>
  <h2>Login</h2>

  <form id="loginForm">
    <div>
      <label>Username:</label><br />
      <input type="text" id="username" required />
    </div>

    <div style="margin-top: 10px;">
      <label>Password:</label><br />
      <input type="password" id="password" required />
    </div>

    <button style="margin-top: 15px;" type="submit">Login</button>
  </form>

  <p id="message" style="color: red;"></p>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    // 🔁 Replace these with your Supabase project values
    const SUPABASE_URL = "https://grjrvxafmemeohmvllik.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyanJ2eGFmbWVtZW9obXZsbGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2Njc0OTcsImV4cCI6MjA4NTI0MzQ5N30.FlOqi4pTMOoAxMrNiIwF8fq4cQGc6k6886UnIbuVs2Y";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.textContent = "";

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      // Query Supabase table for matching username + password
      const { data, error } = await supabase
        .from("users")
        .select("id, username")
        .eq("username", username)
        .eq("password", password)
        .limit(1);

      if (error) {
        message.textContent = "Error checking login: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        message.textContent = "Invalid username or password.";
        return;
      }

	// Success: save username and redirect (also pass it in URL)
	const cleanUsername = username.trim();
	localStorage.setItem("loggedInUsername", cleanUsername);

	window.location.href = `welcome.html?u=${encodeURIComponent(cleanUsername)}`;

    });
  </script>
</body>
</html>
